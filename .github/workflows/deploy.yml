name: Deploy SwissHub Production

on:
  push:
    branches:
      - production

concurrency:
  group: swisshub-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

  deploy:
    name: Deploy Production
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to SwissHub server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -e

            cd /opt/swisshub

            echo "=== SwissHub Production Deployment ==="

            echo "1. Lade neuesten Production-Stand..."
            git fetch origin production
            git checkout production
            git reset --hard origin/production

            echo "2. Baue Docker Images..."
            docker compose -f docker-compose.prod.yml build

            echo "3. Starte Migration und Services..."
            docker compose -f docker-compose.prod.yml up -d

            echo "4. Warte auf Services..."
            sleep 20

            echo "5. Prüfe Container..."
            docker compose -f docker-compose.prod.yml ps

            echo "6. Prüfe WebApp..."
            curl --fail \
              --silent \
              --show-error \
              --max-time 30 \
              https://system.swisshub.gg \
              > /dev/null

            echo "=== DEPLOYMENT ERFOLGREICH ==="
