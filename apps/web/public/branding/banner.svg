<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="220" height="160" role="img" aria-label="SwissHub Bot">
  <defs>
    <linearGradient id="bot-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2f" />
      <stop offset="100%" stop-color="#141417" />
    </linearGradient>
    <radialGradient id="bot-eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a60" />
      <stop offset="100%" stop-color="#83060a" />
    </radialGradient>
    <filter id="bot-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="110" cy="146" rx="62" ry="9" fill="#000" opacity="0.55" />

  <rect x="46" y="34" width="128" height="96" rx="30" fill="url(#bot-body)" stroke="#3a3a41" stroke-width="2" />
  <rect x="26" y="66" width="18" height="40" rx="9" fill="#26262b" stroke="#3a3a41" stroke-width="2" />
  <rect x="176" y="66" width="18" height="40" rx="9" fill="#26262b" stroke="#3a3a41" stroke-width="2" />
  <path d="M110 34V18" stroke="#3a3a41" stroke-width="4" stroke-linecap="round" />
  <circle cx="110" cy="14" r="6" fill="url(#bot-eye)" filter="url(#bot-glow)" />

  <g filter="url(#bot-glow)">
    <path d="M68 74 L98 84 L68 96 Z" fill="url(#bot-eye)" />
    <path d="M152 74 L122 84 L152 96 Z" fill="url(#bot-eye)" />
  </g>

  <rect x="86" y="110" width="48" height="8" rx="4" fill="#1c1c20" stroke="#3a3a41" stroke-width="1.5" />
</svg>
