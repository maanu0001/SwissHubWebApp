# SwissHub Bot WebApp - nginx Reverse Proxy
#
# Ablegen unter /etc/nginx/sites-available/system.swisshub.gg.conf und
# verlinken nach /etc/nginx/sites-enabled/. Die TLS-Zeilen werden von
# `certbot --nginx` automatisch ergaenzt bzw. koennen manuell gesetzt werden.
#
#   ln -s /etc/nginx/sites-available/system.swisshub.gg.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# HTTP -> HTTPS (Certbot legt hier zusaetzlich seinen ACME-Pfad ab)
server {
    listen 80;
    listen [::]:80;
    server_name system.swisshub.gg;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name system.swisshub.gg;

    # --- TLS (von Certbot verwaltet) -------------------------------------
    ssl_certificate     /etc/letsencrypt/live/system.swisshub.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/system.swisshub.gg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SwissHubTLS:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Logs -------------------------------------------------------------
    access_log /var/log/nginx/swisshub-access.log;
    error_log  /var/log/nginx/swisshub-error.log;

    # Discord-Gruende und Formulare sind klein - grosse Uploads gibt es nicht.
    client_max_body_size 2m;

    # Serverkennung nicht preisgeben.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Diese Header braucht die WebApp: TRUST_PROXY=true wertet
        # X-Forwarded-For fuer Rate Limits und Audit Log aus, X-Forwarded-Proto
        # sorgt fuer korrekte https-URLs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Sicherheitsheader (CSP, HSTS, ...) setzt die WebApp selbst - sie
        # werden hier bewusst nicht ueberschrieben.
        proxy_buffering off;
    }

    # Der Health Check muss nicht in den Zugriffslogs landen.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
