# SwissHub Bot WebApp - Produktionsbetrieb (Linux/Docker)
#
#   cp .env.example .env   # ausfuellen, siehe docs/DEPLOYMENT.md
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Enthaelt Datenbank, WebApp und Bot. Secrets kommen ausschliesslich aus .env
# und werden niemals ins Image gebacken. Die WebApp lauscht bewusst nur auf
# 127.0.0.1 - nach aussen geht ausschliesslich nginx mit TLS.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swisshub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wird benoetigt}
      POSTGRES_DB: ${POSTGRES_DB:-swisshub}
      TZ: Europe/Zurich
    volumes:
      - swisshub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-swisshub} -d ${POSTGRES_DB:-swisshub}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Wendet ausstehende Migrationen an, bevor WebApp und Bot starten.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Europe/Zurich
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npm', 'run', 'db:deploy']
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Europe/Zurich
      PORT: 3000
      # Hochgeladene Dateien (Logo) liegen im Volume - ein Rebuild des
      # Containers verliert sie dadurch nicht.
      SWISSHUB_UPLOAD_DIR: /var/lib/swisshub/uploads
    volumes:
      - swisshub-uploads:/var/lib/swisshub/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Nur lokal erreichbar - TLS und Domain uebernimmt nginx.
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Europe/Zurich
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Zeit fuer den kontrollierten Shutdown (laufende Jobs, Heartbeat).
    stop_grace_period: 30s

volumes:
  swisshub-postgres:
  swisshub-uploads:
