# SwissHub Bot WebApp - Produktionsbetrieb (Linux/Docker)
#
#   cp .env.example .env   # ausfuellen, siehe docs/DEPLOYMENT.md
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Enthaelt Datenbank, WebApp und Bot. Secrets kommen ausschliesslich aus .env
# und werden niemals ins Image gebacken. Die WebApp lauscht bewusst nur auf
# 127.0.0.1 - nach aussen geht ausschliesslich nginx mit TLS.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swisshub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wird benoetigt}
      POSTGRES_DB: ${POSTGRES_DB:-swisshub}
      TZ: Europe/Zurich
    volumes:
      - swisshub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-swisshub} -d ${POSTGRES_DB:-swisshub}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Wendet ausstehende Migrationen an, bevor WebApp und Bot starten.
  migrate:
    # Fester Name statt eines von Compose abgeleiteten: nur so laesst sich von
    # aussen pruefen, ob ein Container tatsaechlich auf dem frisch gebauten
    # Abbild laeuft - und genau das prueft die Pipeline nach dem Deployment.
    image: swisshub-migrate:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Europe/Zurich
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npm', 'run', 'db:deploy']
    restart: 'no'

  web:
    # Fester Name statt eines von Compose abgeleiteten: nur so laesst sich von
    # aussen pruefen, ob ein Container tatsaechlich auf dem frisch gebauten
    # Abbild laeuft - und genau das prueft die Pipeline nach dem Deployment.
    image: swisshub-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Europe/Zurich
      PORT: 3000
      # Hochgeladene Dateien (Logo) liegen im Volume - ein Rebuild des
      # Containers verliert sie dadurch nicht.
      SWISSHUB_UPLOAD_DIR: /var/lib/swisshub/uploads
    volumes:
      - swisshub-uploads:/var/lib/swisshub/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Nur lokal erreichbar - TLS und Domain uebernimmt nginx.
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bot:
    # Fester Name statt eines von Compose abgeleiteten: nur so laesst sich von
    # aussen pruefen, ob ein Container tatsaechlich auf dem frisch gebauten
    # Abbild laeuft - und genau das prueft die Pipeline nach dem Deployment.
    image: swisshub-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Europe/Zurich
      # Der Bot liest die im Dashboard hochgeladenen Hintergrundbilder der
      # Levelkarte von hier - schreiben tut ausschliesslich die WebApp.
      SWISSHUB_UPLOAD_DIR: /var/lib/swisshub/uploads
    volumes:
      - swisshub-uploads:/var/lib/swisshub/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Der Bot hat keine Schnittstelle, die man anfragen koennte. Er schreibt
    # deshalb in jedem Herzschlag-Durchgang eine Datei; ist sie frisch, dreht
    # sich die Job-Schleife noch. «Prozess laeuft» allein waere keine Auskunft:
    # das waere er auch dann, wenn die Verbindung zu Discord abgerissen ist
    # und kein Job mehr durchkommt.
    #
    # Der Herzschlag laeuft alle 20 Sekunden; zwei Minuten lassen mehrere
    # Durchgaenge ausfallen, bevor der Container als krank gilt.
    #
    # `$$` statt `$`: Compose ersetzt sonst selbst, bevor die Shell im
    # Container den Ausdruck ueberhaupt zu sehen bekommt.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -n "$$(find /tmp/swisshub-bot-alive -mmin -2 2>/dev/null)"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Anmeldung bei Discord, Slash Commands und der erste Sync brauchen Zeit.
      start_period: 90s
    # Zeit fuer den kontrollierten Shutdown (laufende Jobs, Heartbeat).
    stop_grace_period: 30s

  # Voice-Laufzeit fuer SwissHub Music.
  #
  # Eigener Dienst, weil Voice-Wiedergabe FFmpeg, Opus und yt-dlp braucht -
  # nichts davon gehoert in das Abbild der WebApp. Der Dienst haelt die
  # Bot-Tokens, meldet seine Bots in der Datenbank an und arbeitet Befehle ab.
  #
  # Bewusst KEIN Port nach aussen: die interne Schnittstelle fuer die Suche ist
  # nur im Docker-Netz erreichbar.
  music-runtime:
    image: swisshub-music-runtime:latest
    build:
      context: .
      dockerfile: apps/music-runtime/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Zurich
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7700/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Zeit, um Voice sauber zu verlassen und FFmpeg zu beenden.
    stop_grace_period: 30s

volumes:
  swisshub-postgres:
  swisshub-uploads:
